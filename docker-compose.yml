services:
  mariadb:
    image: mariadb:latest
    container_name: database_container
    restart: always
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
      MARIADB_USER: 'root'
      MARIADB_PASSWORD: ''
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  backend:
    build: ./API
    ports:
     - "3000:3000"
    depends_on:
     - mariadb
    container_name: API-gateway
    volumes:
      - ./API:/usr/src/app

volumes:
  mariadb_data:
    driver: local